name: CI

on:
  push:
    branches:
      - main
    paths: &ci_paths
      - .github/dependabot.yml
      - .github/workflows/**
      - .dockerignore
      - .hadolint.yaml
      - README.md
      - devices/**
      - docker/**
      - docs/**
      - local-feeds/**
      - locks/**
      - mise.lock
      - mise.toml
      - patches/**
      - scripts/**
  pull_request:
    branches:
      - main
    paths: *ci_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell syntax and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          # Keep mise compatible with the provenance metadata in mise.lock.
          version: &mise_version 2026.10.8
          install_args: "github:kjanat/actionlint hadolint shellcheck"

      - name: Validate shell scripts and workflow
        env:
          MISE_AUTO_INSTALL: 0
        run: mise run check:shell

  repository-metadata:
    name: Lock and patch consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          version: *mise_version
          install: false
          cache: false

      - name: Validate repository metadata
        env:
          MISE_AUTO_INSTALL: 0
        run: mise run check:metadata

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          version: *mise_version
          install_args: lychee

      - name: Check Markdown links
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_AUTO_INSTALL: 0
        run: mise run check:links
