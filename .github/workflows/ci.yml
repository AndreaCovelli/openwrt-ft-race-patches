name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell syntax and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(git ls-files 'scripts/*.sh' 'scripts/**/*.sh' 'locks/*.lock' | sort -u)
          for file in "${files[@]}"; do
            bash -n "$file"
          done

      - name: Run shellcheck
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t scripts < <(git ls-files 'scripts/*.sh' 'scripts/**/*.sh' | sort -u)
          shellcheck --severity=warning -x "${scripts[@]}"

          mapfile -t locks < <(git ls-files 'locks/*.lock' | sort)
          shellcheck --severity=warning --shell=bash --exclude=SC2034 "${locks[@]}"

      - name: Check ASU-like upgrade preparation workflow
        shell: bash
        run: scripts/ci/check-prepare-openwrt-upgrade.sh

      - name: Check router image upgrade helper
        shell: bash
        run: scripts/ci/check-upgrade-router-image.sh

      - name: Check prebuilt APK helper
        shell: bash
        run: scripts/ci/check-prebuilt-apks.sh

  repository-metadata:
    name: Lock and patch consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check lock files
        shell: bash
        run: scripts/ci/check-locks.sh

      - name: Check build artifact names
        shell: bash
        run: scripts/ci/check-build-names.sh

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          fail: true
          failIfEmpty: true
          token: ${{ github.token }}
          args: >-
            --root-dir .
            --verbose
            --no-progress
            --timeout 20
            --max-concurrency 4
            --exclude '^https://www\.spinics\.net/lists/kernel/msg1478599\.html$'
            --exclude '^https://forum\.openwrt\.org/t/daemon-err-hostapd-nl80211-kernel-reports-key-addition-failed-is-this-a-problem/100370'
            README.md
            docs/**/*.md
