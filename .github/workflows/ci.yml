name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell syntax and lint
    uses: AndreaCovelli/repo-baseline/.github/workflows/check.yml@a3cd314a40868370e41af02ecf02af60df5614ee # v1.0.1
    permissions:
      contents: read
      pull-requests: read
    with:
      task: check:shell
      install-args: github:kjanat/actionlint hadolint shellcheck
      timeout-minutes: 10
      paths: &ci_paths |
        renovate.json
        .github/workflows/**
        .dockerignore
        .hadolint.yaml
        README.md
        devices/**
        docker/**
        docs/**
        local-feeds/**
        locks/**
        mise.lock
        mise.toml
        patches/**
        scripts/**

  repository-metadata:
    name: Lock and patch consistency
    uses: AndreaCovelli/repo-baseline/.github/workflows/check.yml@a3cd314a40868370e41af02ecf02af60df5614ee # v1.0.1
    permissions:
      contents: read
      pull-requests: read
    with:
      task: check:metadata
      install-args: shellcheck
      timeout-minutes: 5
      paths: *ci_paths

  links:
    name: Markdown links
    uses: AndreaCovelli/repo-baseline/.github/workflows/check.yml@a3cd314a40868370e41af02ecf02af60df5614ee # v1.0.1
    permissions:
      contents: read
      pull-requests: read
    with:
      task: check:links
      install-args: lychee
      timeout-minutes: 10
      paths: *ci_paths

  validate:
    name: Validate
    needs: [shell, repository-metadata, links]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
