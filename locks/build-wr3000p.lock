)

PATCH_SOURCE='patches/25.12.5/subsys/400-mac80211-defer-ap-side-ft-key-upload.patch'
PATCH_DEST='package/kernel/mac80211/patches/subsys/400-mac80211-defer-ap-side-ft-key-upload.patch'
PATCH_SHA256='88a2dd27e51e0e23da36373d46dbdfaa0ec057b426da0e411ff0794b646e7774'

CONFIG_FRAGMENT='devices/wr3000p/diffconfig'
WORLD_SOURCE='devices/wr3000p/apk-installed-and-world.txt'
REFERENCE_MANIFEST='devices/wr3000p/installed.manifest'

TARGET='mediatek'
SUBTARGET='filogic'
DEVICE_ID='cudy_wr3000p-v1'
ARTIFACT_VARIANT='patched'

DEFAULT_WORK_ROOT='build'
DEFAULT_CACHE_ROOT='cache'
DEFAULT_DOWNLOAD_JOBS='8'

EXTRA_CONFIG_LINES=(
  'CONFIG_FEED_usteer_patched=m'
  'CONFIG_PACKAGE_kmod-crypto-acompress=y'
  'CONFIG_PACKAGE_kmod-lib-lzo=y'
)

# On mediatek/filogic 6.12 these kmods can be built into the kernel instead
# of emitted as separate packages, while older router world files may still
# list them explicitly.
MANIFEST_BUILTIN_PACKAGE_NAMES=(
  'kmod-crypto-acompress'
  'kmod-lib-lzo'
)

# Build with the official SDK and ImageBuilder by default. The SDK rebuilds
# only these packages from the patched source; --build-method source builds
# the whole tree instead.
DEFAULT_BUILD_METHOD='imagebuilder'
IMAGEBUILDER_PATCHED_PACKAGES=(
  'kmod-mac80211'
)

# Official SDK and ImageBuilder for --build-method imagebuilder. Refresh
# with scripts/pin-imagebuilder.sh, which rewrites these assignments.
